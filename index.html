<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <meta
        name="description"
        content="PANKAJ Restaurant Waiter Ordering System"
    >

    <title>PANKAJ — Waiter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section id="loginScreen">

        <div class="login-card">

            <div class="brand">

                <div class="brand-logo">
                    PK
                </div>

                <h1>PANKAJ</h1>

                <p>Restaurant Ordering System</p>

            </div>

            <div
                id="loginError"
                class="login-error"
            >
                Invalid waiter ID or password.
            </div>

            <form id="loginForm">

                <div class="field">

                    <label for="username">
                        Waiter ID
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="Enter waiter ID"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>

        </div>

    </section>


    <section id="app">

        <header class="topbar">

            <div class="top-brand">
                PANKAJ
            </div>

            <div class="waiter-info">

                <div
                    class="waiter-avatar"
                    id="waiterAvatar"
                >
                    W
                </div>

                <span
                    class="waiter-name"
                    id="waiterName"
                >
                    Waiter
                </span>

                <button
                    type="button"
                    class="logout-btn"
                    id="logoutBtn"
                >
                    Logout
                </button>

            </div>

        </header>


        <main class="main">

            <div class="page-header">

                <div>

                    <h2>
                        New Order
                    </h2>

                    <p>
                        Select table and add items
                    </p>

                </div>

                <div
                    class="order-count"
                    id="activeOrderCount"
                >
                    0 Active
                </div>

            </div>


            <section class="table-box">

                <label>
                    SELECT TABLE
                </label>

                <div
                    class="table-grid"
                    id="tableGrid"
                ></div>

            </section>


            <nav
                class="categories"
                id="categories"
                aria-label="Menu categories"
            ></nav>


            <div class="content-grid">

                <section class="menu-section">

                    <div
                        class="menu-grid"
                        id="menuGrid"
                    ></div>

                </section>


                <aside
                    class="cart"
                    id="cart"
                >

                    <div class="cart-header">

                        <h3>
                            Current Order
                        </h3>

                        <span
                            class="cart-table"
                            id="cartTable"
                        >
                            No table
                        </span>

                    </div>


                    <div
                        class="cart-items"
                        id="cartItems"
                    >

                        <div class="empty-cart">
                            No items added
                        </div>

                    </div>


                    <div class="cart-note">

                        <textarea
                            id="orderNote"
                            placeholder="Order note / special instruction..."
                            rows="3"
                        ></textarea>

                    </div>


                    <div class="cart-summary">

                        <div class="summary-row">

                            <span>
                                Items
                            </span>

                            <span id="cartCount">
                                0
                            </span>

                        </div>


                        <div class="summary-row total">

                            <span>
                                Total
                            </span>

                            <span id="total">
                                ₹0
                            </span>

                        </div>


                        <button
                            type="button"
                            class="confirm-btn"
                            id="confirmOrderBtn"
                            disabled
                        >
                            Confirm Order
                        </button>

                    </div>

                </aside>

            </div>


            <section class="orders-section">

                <div class="section-heading">

                    <div>

                        <h3>
                            Active Orders
                        </h3>

                        <p>
                            Confirmed orders from this device
                        </p>

                    </div>

                </div>


                <div
                    class="orders-list"
                    id="ordersList"
                >

                    <div class="empty-cart">
                        No active orders
                    </div>

                </div>

            </section>

        </main>

    </section>


    <div
        class="mobile-cart-bar"
        id="mobileCartBar"
    >

        <div class="mobile-cart-info">

            <span id="mobileCartCount">
                0 items
            </span>

            <strong id="mobileCartTotal">
                ₹0
            </strong>

        </div>

        <button
            type="button"
            id="mobileCartBtn"
        >
            View Cart
        </button>

    </div>


    <div
        id="toast"
        role="status"
        aria-live="polite"
    ></div>


    <div
        id="loader"
        aria-hidden="true"
    >

        <div class="loader-box">

            <div class="loader-spinner"></div>

            <span>
                Please wait...
            </span>

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
