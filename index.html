<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PANKAJ — Waiter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOGIN -->

    <section id="loginScreen" class="login-screen">

        <div class="login-card">

            <div class="logo">
                PK
            </div>

            <h1>PANKAJ</h1>

            <p>Waiter Ordering System</p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>

                <p
                    id="loginError"
                    class="login-error"
                ></p>

                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>

        </div>

    </section>


    <!-- WAITER APP -->

    <section id="app" class="app">

        <!-- HEADER -->

        <header class="header">

            <div class="header-brand">

                <div class="brand-logo">
                    PK
                </div>

                <div>
                    <h1>PANKAJ</h1>
                    <span>Restaurant</span>
                </div>

            </div>


            <div class="header-actions">

                <span id="waiterName">
                    Waiter
                </span>

                <button
                    id="logoutButton"
                    type="button"
                >
                    Logout
                </button>

            </div>

        </header>


        <!-- MAIN -->

        <main class="main">


            <!-- PAGE TITLE -->

            <section class="page-header">

                <div>

                    <h2>
                        New Order
                    </h2>

                    <p>
                        Select items from the menu
                    </p>

                </div>

            </section>


            <!-- MENU -->

            <section class="menu-section">

                <div class="section-header">

                    <h3>
                        Menu
                    </h3>

                </div>


                <!-- CATEGORIES -->

                <nav
                    id="categories"
                    class="categories"
                >

                    <!-- Categories will come here -->

                </nav>


                <!-- MENU ITEMS -->

                <div
                    id="menuGrid"
                    class="menu-grid"
                >

                    <!-- Menu items will come here -->

                </div>

            </section>


            <!-- CURRENT ORDER -->

            <section class="order-section">

                <div class="section-header">

                    <div>

                        <h3>
                            Current Order
                        </h3>

                        <p>
                            Review items before confirming
                        </p>

                    </div>

                    <span
                        id="cartCount"
                        class="cart-count"
                    >
                        0
                    </span>

                </div>


                <!-- CART -->

                <div
                    id="cartItems"
                    class="cart-items"
                >

                    <!-- Cart items will come here -->

                    <div class="empty-cart">

                        <strong>
                            No items added
                        </strong>

                        <span>
                            Select items from the menu
                        </span>

                    </div>

                </div>


                <!-- NOTE -->

                <div class="order-note">

                    <label for="orderNote">
                        Special Instructions
                    </label>

                    <textarea
                        id="orderNote"
                        rows="3"
                        placeholder="Example: Less spicy, no onion..."
                    ></textarea>

                </div>


                <!-- SUMMARY -->

                <div class="order-summary">

                    <div class="summary-row">

                        <span>
                            Items
                        </span>

                        <strong id="summaryItems">
                            0
                        </strong>

                    </div>


                    <div class="summary-row total">

                        <span>
                            Total
                        </span>

                        <strong id="summaryTotal">
                            ₹0
                        </strong>

                    </div>


                    <button
                        id="confirmOrderButton"
                        type="button"
                        disabled
                    >
                        Confirm Order
                    </button>

                </div>

            </section>


            <!-- ACTIVE ORDERS -->

            <section class="active-orders-section">

                <div class="section-header">

                    <div>

                        <h3>
                            Active Orders
                        </h3>

                        <p>
                            Confirmed orders
                        </p>

                    </div>

                    <span
                        id="activeOrderCount"
                    >
                        0 Active
                    </span>

                </div>


                <div
                    id="ordersList"
                    class="orders-list"
                >

                    <!-- Orders will come here -->

                    <div class="empty-orders">

                        No active orders

                    </div>

                </div>

            </section>

        </main>


        <!-- MOBILE CART -->

        <div
            id="mobileCart"
            class="mobile-cart"
        >

            <div>

                <span>
                    Current Order
                </span>

                <strong id="mobileCartTotal">
                    ₹0
                </strong>

            </div>

            <button
                id="mobileCartButton"
                type="button"
            >
                View Order
            </button>

        </div>

    </section>


    <!-- TOAST -->

    <div
        id="toast"
        class="toast"
    ></div>


    <script src="app.js"></script>

</body>
</html>
