<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>PANKAJ — Waiter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="loginScreen" class="screen">

```
<div class="login-card">

    <div class="logo">PK</div>

    <h1>PANKAJ</h1>
    <p>Waiter Ordering System</p>

    <form id="loginForm">

        <label for="waiterId">Waiter ID</label>
        <input
            type="text"
            id="waiterId"
            placeholder="Enter waiter ID"
            autocomplete="username"
            required
        >

        <label for="waiterPassword">Password</label>
        <input
            type="password"
            id="waiterPassword"
            placeholder="Enter password"
            autocomplete="current-password"
            required
        >

        <div id="loginError" class="error"></div>

        <button type="submit" class="primary-btn">
            Login
        </button>

    </form>

</div>
```

</div>

<div id="app" class="app hidden">

```
<header class="topbar">

    <div class="brand">
        <strong>PANKAJ</strong>
        <span>Restaurant</span>
    </div>

    <div class="user-area">

        <div class="avatar" id="waiterAvatar">
            W
        </div>

        <div class="user-name">
            <span>Waiter</span>
            <strong id="waiterName">Waiter</strong>
        </div>

        <button
            type="button"
            id="logoutBtn"
            class="logout-btn"
        >
            Logout
        </button>

    </div>

</header>


<main class="container">

    <section class="page-title">

        <div>
            <h2>New Order</h2>
            <p>Select table and add items</p>
        </div>

        <div
            id="activeOrderCount"
            class="order-counter"
        >
            0 Active
        </div>

    </section>


    <section class="panel">

        <div class="panel-title">
            <h3>Select Table</h3>
        </div>

        <div
            id="tableGrid"
            class="table-grid"
        ></div>

    </section>


    <section class="category-section">

        <div
            id="categories"
            class="categories"
        ></div>

    </section>


    <section class="order-layout">


        <div class="menu-area">

            <div
                id="menuGrid"
                class="menu-grid"
            ></div>

        </div>


        <aside class="cart">

            <div class="cart-header">

                <div>
                    <h3>Current Order</h3>

                    <span
                        id="cartTable"
                        class="cart-table"
                    >
                        Select table
                    </span>
                </div>

                <span
                    id="cartCount"
                    class="cart-count"
                >
                    0
                </span>

            </div>


            <div
                id="cartItems"
                class="cart-items"
            >

                <div class="empty-cart">
                    No items added
                </div>

            </div>


            <div class="order-note">

                <label for="orderNote">
                    Special Instructions
                </label>

                <textarea
                    id="orderNote"
                    rows="3"
                    placeholder="Less spicy, no onion, etc."
                ></textarea>

            </div>


            <div class="cart-footer">

                <div class="total-row">

                    <span>Total</span>

                    <strong id="total">
                        ₹0
                    </strong>

                </div>

                <button
                    type="button"
                    id="confirmOrderBtn"
                    class="primary-btn confirm-btn"
                    disabled
                >
                    Confirm Order
                </button>

            </div>

        </aside>

    </section>


    <section class="active-orders">

        <div class="section-heading">

            <div>
                <h3>Active Orders</h3>
                <p>
                    Orders placed by waiters
                </p>
            </div>

        </div>

        <div
            id="ordersList"
            class="orders-list"
        ></div>

    </section>

</main>
```

</div>

<div
    id="mobileCartBar"
    class="mobile-cart-bar"
>

```
<div>

    <span>Cart</span>

    <strong id="mobileCartTotal">
        ₹0
    </strong>

</div>

<button
    type="button"
    id="mobileCartBtn"
>
    View Cart
</button>
```

</div>

<div
    id="toast"
    class="toast"
></div>

<div
    id="loader"
    class="loader hidden"
>

```
<div class="loader-box">

    <div class="spinner"></div>

    <span>Loading...</span>

</div>
```

</div>

<script src="app.js"></script>

</body>
</html>
