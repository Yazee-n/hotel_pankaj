<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PANKAJ — Waiter</title>

    <script src="app.js"></script>
</head>

<body>

    <section id="app" class="app">

        <header class="header">

            <div class="header-brand">

                <div class="brand-logo">
                    PK
                </div>

                <div>
                    <h1>PANKAJ</h1>
                    <span>Restaurant</span>
                </div>

            </div>


            <div class="header-actions">

                <span id="waiterName">
                    Waiter
                </span>

            </div>

        </header>


        <main class="main">


            <section class="page-header">

                <div>

                    <h2>
                        New Order
                    </h2>

                    <p>
                        Select items from the menu
                    </p>

                </div>

            </section>


            <section class="menu-section">

                <div class="section-header">

                    <h3>
                        Menu
                    </h3>

                </div>


                <nav
                    id="categories"
                    class="categories"
                    aria-label="Menu categories"
                >
                </nav>


                <div
                    id="menuGrid"
                    class="menu-grid"
                >
                </div>

            </section>


            <section class="order-section">

                <div class="section-header">

                    <div>

                        <h3>
                            Current Order
                        </h3>

                        <p>
                            Review items before confirming
                        </p>

                    </div>

                    <span
                        id="cartCount"
                        class="cart-count"
                    >
                        0
                    </span>

                </div>


                <div
                    id="cartItems"
                    class="cart-items"
                >

                    <div class="empty-cart">

                        <strong>
                            No items added
                        </strong>

                        <span>
                            Select items from the menu
                        </span>

                    </div>

                </div>


                <div class="order-note">

                    <label for="orderNote">
                        Special Instructions
                    </label>

                    <textarea
                        id="orderNote"
                        rows="3"
                        placeholder="Example: Less spicy, no onion..."
                    ></textarea>

                </div>


                <div class="order-summary">

                    <div class="summary-row">

                        <span>
                            Items
                        </span>

                        <strong id="summaryItems">
                            0
                        </strong>

                    </div>


                    <div class="summary-row total">

                        <span>
                            Total
                        </span>

                        <strong id="summaryTotal">
                            ₹0
                        </strong>

                    </div>


                    <button
                        id="confirmOrderButton"
                        type="button"
                        disabled
                    >
                        Confirm Order
                    </button>

                </div>

            </section>


            <section class="active-orders-section">

                <div class="section-header">

                    <div>

                        <h3>
                            Active Orders
                        </h3>

                        <p>
                            Confirmed orders
                        </p>

                    </div>

                    <span id="activeOrderCount">
                        0 Active
                    </span>

                </div>


                <div
                    id="ordersList"
                    class="orders-list"
                >

                    <div class="empty-orders">
                        No active orders
                    </div>

                </div>

            </section>

        </main>


        <div
            id="mobileCart"
            class="mobile-cart"
        >

            <div>

                <span>
                    Current Order
                </span>

                <strong id="mobileCartTotal">
                    ₹0
                </strong>

            </div>

            <button
                id="mobileCartButton"
                type="button"
            >
                View Order
            </button>

        </div>

    </section>


    <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
    ></div>


    <script src="app.js"></script>

</body>
</html>
